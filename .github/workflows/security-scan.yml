name: Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  trivy-scan:
    name: Trivy Scan (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: backend
            scan-ref: './backend'
            skip-dirs: ''
            artifact-name: trivy-backend-sarif
          - target: frontend
            scan-ref: '.'
            skip-dirs: 'backend,android'
            artifact-name: trivy-frontend-sarif
    steps:
      - uses: actions/checkout@v7

      - name: Trivy — показать находки в логе
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: ${{ matrix.scan-ref }}
          skip-dirs: ${{ matrix.skip-dirs }}
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'
          format: 'table'

      - name: Trivy — CRITICAL gate
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: ${{ matrix.scan-ref }}
          skip-dirs: ${{ matrix.skip-dirs }}
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-report.sarif'

      - name: Upload report to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-report.sarif'

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact-name }}
          path: trivy-report.sarif
          retention-days: 7