name: Build and Deploy on Tag

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        working-directory: ./backend
        run: go mod download

      - name: Run tests with race detector
        working-directory: ./backend
        run: go test ./... -race -count=1 -v

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for Android
        run: npm run build:android

      - name: Add Android platform
        run: npx cap add android

      - name: Generate native icons and splash
        run: npx @capacitor/assets generate --android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform
        run: |
          COMPILE_SDK=$(grep -oP 'compileSdkVersion = \K[0-9]+' android/variables.gradle || true)
          COMPILE_SDK=${COMPILE_SDK:-36}
          echo "compileSdk=android-${COMPILE_SDK}"
          sdkmanager "platforms;android-${COMPILE_SDK}"

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "release/nikitaredko-site-${{ github.ref_name }}.apk"

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*.apk

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Git Info
        id: git-info
        run: |
          echo "commit_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "commit_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          if git describe --tags --exact-match >/dev/null 2>&1; then
            echo "git_tag=$(git describe --tags --exact-match)" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "git_tag=" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=test-${{ github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_GIT_COMMIT=${{ steps.git-info.outputs.commit_hash }}
            VITE_GIT_COMMIT_SHORT=${{ steps.git-info.outputs.commit_short }}
            VITE_GIT_TAG=${{ steps.git-info.outputs.git_tag }}
            VITE_GIT_IS_RELEASE=${{ steps.git-info.outputs.is_release }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy docker-compose.yml to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.yml"
          target: "/opt/nikitaredko"

      - name: Deploy to Test Environment
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            echo ">>> Deploying test version ${{ github.ref_name }}..."
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            
            cd /opt/nikitaredko
            cp /etc/nikitaredko-site/.env.test .env
            export IMAGE_NAME="ghcr.io/${{ github.repository }}:test-${{ github.ref_name }}"
            export CONTAINER_NAME="nikitaredko-site-test"
            export PORT="8081"
            docker compose -p nikitaredko-test pull
            docker compose -p nikitaredko-test up -d
            
            echo ">>> Test deployment completed"

      - name: Wait and Health Check Test Environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo ">>> Waiting for test environment to start..."
            sleep 10
            
            echo ">>> Running health check on test environment..."
            MAX_RETRIES=10
            RETRY_COUNT=0
            
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if curl -f -s http://localhost:8081/api/cache/health > /dev/null 2>&1; then
                echo ">>> Health check PASSED"
                exit 0
              fi
              
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo ">>> Health check attempt $RETRY_COUNT/$MAX_RETRIES failed, retrying in 5 seconds..."
              sleep 5
            done
            
            echo ">>> Health check FAILED after $MAX_RETRIES attempts"
            exit 1

      - name: Cleanup Test Environment
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo ">>> Cleaning up test environment..."
            cd /opt/nikitaredko
            docker compose -p nikitaredko-test down
            docker rmi ghcr.io/${{ github.repository }}:test-${{ github.ref_name }} || true
            
            echo ">>> Test environment cleaned up"

      - name: Deploy to Production
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            echo ">>> Deploying to production ${{ github.ref_name }}..."
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            cd /opt/nikitaredko

            # Сохраняем текущий рабочий тег для возможного rollback
            PREV_IMAGE=$(docker inspect --format='{{.Config.Image}}' nikitaredko-site-prod 2>/dev/null || echo "")
            echo "$PREV_IMAGE" > /tmp/nikitaredko-prev-image

            cp /etc/nikitaredko-site/.env .env
            export IMAGE_NAME="ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
            export CONTAINER_NAME="nikitaredko-site-prod"
            export PORT="8080"
            docker compose -p nikitaredko-prod pull
            docker compose -p nikitaredko-prod up -d --remove-orphans

            # Удаляем только старые dangling-образы, НЕ трогаем предыдущий рабочий
            docker image prune -f --filter "until=168h"

            echo ">>> Production deployment completed successfully!"

      - name: Rollback on Failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            echo ">>> Deployment failed! Attempting rollback..."

            PREV_IMAGE=$(cat /tmp/nikitaredko-prev-image 2>/dev/null || echo "")

            if [ -z "$PREV_IMAGE" ]; then
              echo ">>> No previous image found, cannot rollback"
              exit 1
            fi

            echo ">>> Rolling back to: $PREV_IMAGE"
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            cd /opt/nikitaredko
            export IMAGE_NAME="$PREV_IMAGE"
            export CONTAINER_NAME="nikitaredko-site-prod"
            export PORT="8080"
            docker compose -p nikitaredko-prod pull
            docker compose -p nikitaredko-prod up -d --remove-orphans

            echo ">>> Rollback completed to $PREV_IMAGE"

    outputs:
      deploy_status: ${{ job.status }}
      git_tag: ${{ steps.git-info.outputs.git_tag }}